<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Vibrant pastel rose-coral gradient for calendar header & ears -->
    <linearGradient id="catHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C8A" />
      <stop offset="100%" stop-color="#FF386B" />
    </linearGradient>

    <!-- Soft ambient shadow -->
    <filter id="softShadow" x="-15%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#FF3366" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- White Calendar Page Body -->
    <rect
      x="14"
      y="24"
      width="72"
      height="66"
      rx="18"
      fill="#FFFFFF"
      stroke="#FFCCD8"
      stroke-width="2"
    />

    <!-- Calendar Top Bar with Integrated Cat Ears -->
    <path
      d="
        M 14 42
        L 14 32
        C 14 24, 18 20, 24 20
        L 25 20
        C 23 13, 27 6, 33 6
        C 39 6, 42 14, 44 20
        L 56 20
        C 58 14, 61 6, 67 6
        C 73 6, 77 13, 76 20
        L 76 20
        C 82 20, 86 24, 86 32
        L 86 42
        Z
      "
      fill="url(#catHeaderGrad)"
    />
  </g>

  <!-- Inner Ears (Soft pastel pink) -->
  <path
    d="M 28 19 C 27 15, 29 11, 33 11 C 37 11, 39 15, 38 19 Z"
    fill="#FFE6EC"
  />
  <path
    d="M 72 19 C 73 15, 71 11, 67 11 C 63 11, 61 15, 62 19 Z"
    fill="#FFE6EC"
  />

  <!-- Clean White Heart in Calendar Header -->
  <path
    d="
      M 50 33
      C 47.5 29.5, 43 29.5, 43 33.5
      C 43 37, 50 41, 50 41
      C 50 41, 57 37, 57 33.5
      C 57 29.5, 52.5 29.5, 50 33
      Z
    "
    fill="#FFFFFF"
  />

  <!-- Minimalist Cat Face on Calendar Page -->
  <!-- Happy curved smiling eyes -->
  <path
    d="M 31 60 Q 38 53 45 60"
    stroke="#3D2833"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 55 60 Q 62 53 69 60"
    stroke="#3D2833"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Rosy Blush Cheeks -->
  <circle cx="26" cy="67" r="4.5" fill="#FFAEC5" opacity="0.6" />
  <circle cx="74" cy="67" r="4.5" fill="#FFAEC5" opacity="0.6" />

  <!-- Tiny Pink Nose -->
  <circle cx="50" cy="66" r="2.2" fill="#FF477E" />

  <!-- Sweet Cat Smile -->
  <path
    d="M 46 69.5 Q 48 72 50 70.8 Q 52 72 54 69.5"
    stroke="#3D2833"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />
</svg>
